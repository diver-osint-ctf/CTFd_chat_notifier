[pytest]
# Lives here (rather than in the plugin root pyproject.toml) so that pytest
# resolves rootdir to tests/ instead of the plugin root. The plugin root has
# its own __init__.py (the CTFd plugin entrypoint), and if pytest treats the
# plugin root as a Package node it tries to import that __init__.py — which
# pulls in CTFd modules that aren't installed for unit tests.
addopts = -ra -q
testpaths = .
